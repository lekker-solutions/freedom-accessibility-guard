name: Release

# Push a tag like v1.0 to build a signed APK and publish it as a GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, e.g. v1.0 (created at the current commit if it doesn't exist)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install Android workload and SDK packages
        run: |
          dotnet workload install android
          dotnet build -t:InstallAndroidDependencies -f net10.0-android -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=True

      - name: Version from tag
        id: ver
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build signed APK
        run: >
          dotnet publish -f net10.0-android -c Release
          -p:AndroidSdkDirectory="$ANDROID_HOME"
          -p:ApplicationDisplayVersion=${{ steps.ver.outputs.version }}
          -p:ApplicationVersion=${{ github.run_number }}
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore="$RUNNER_TEMP/release.keystore"
          -p:AndroidSigningKeyAlias="$KEY_ALIAS"
          -p:AndroidSigningKeyPass=env:KEYSTORE_PASSWORD
          -p:AndroidSigningStorePass=env:KEYSTORE_PASSWORD
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      - name: Name the APK
        run: cp bin/Release/net10.0-android/publish/com.lekkersolutions.accessibilityguard-Signed.apk "AccessibilityGuard-${{ steps.ver.outputs.version }}.apk"

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Accessibility Guard ${{ steps.ver.outputs.version }}
          files: AccessibilityGuard-${{ steps.ver.outputs.version }}.apk
          generate_release_notes: true
